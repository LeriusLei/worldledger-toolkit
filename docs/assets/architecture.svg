   <g id="text_1">
    <text style="fill: #172a42; font: 700 19px 'DejaVu Sans'; text-anchor: start" x="19.8" y="28.044" transform="rotate(-0 19.8 28.044)">A trace you can inspect. A boundary you can test.</text>
   </g>
   <g id="text_2">
    <text style="fill: #60738a; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="20.916" y="51.3288" transform="rotate(-0 20.916 51.3288)">Online decisions use public observations; counterfactual truth stays with the evaluator.</text>
   </g>
   <g id="text_3">
    <text style="fill: #172a42; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="33.75" y="135.0432" transform="rotate(-0 33.75 135.0432)">FINITE WORLDS</text>
   </g>
   <g id="text_4">
    <text style="fill: #60738a; font: 9.5px 'DejaVu Sans'" transform="translate(33.75 161.111316)">Grid / Inventory / Queue</text>
    <text style="fill: #60738a; font: 9.5px 'DejaVu Sans'" transform="translate(33.75 174.99757)">Machine Maintenance</text>
    <text style="fill: #60738a; font: 9.5px 'DejaVu Sans'" transform="translate(33.75 188.883823)">Explicit kernels and public histories</text>
   </g>
   <g id="text_5">
    <text style="fill: #172a42; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="273.69" y="135.0432" transform="rotate(-0 273.69 135.0432)">CANDIDATE DECISIONS</text>
   </g>
   <g id="text_6">
    <text style="fill: #60738a; font: 9.5px 'DejaVu Sans'" transform="translate(273.69 161.111316)">Coherent committees and action sets</text>
    <text style="fill: #60738a; font: 9.5px 'DejaVu Sans'" transform="translate(273.69 174.99757)">Shared observation-contingent policies</text>
    <text style="fill: #60738a; font: 9.5px 'DejaVu Sans'" transform="translate(273.69 188.883823)">Executed branch only</text>
   </g>
   <g id="text_7">
    <text style="fill: #172a42; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="516.42" y="135.0432" transform="rotate(-0 516.42 135.0432)">SEALED EVALUATION</text>
   </g>
   <g id="text_8">
    <text style="fill: #60738a; font: 9.5px 'DejaVu Sans'" transform="translate(516.42 161.111316)">Support, equivalence and regret</text>
    <text style="fill: #60738a; font: 9.5px 'DejaVu Sans'" transform="translate(516.42 174.99757)">Trusted counterfactual fork</text>
    <text style="fill: #60738a; font: 9.5px 'DejaVu Sans'" transform="translate(516.42 188.883823)">Post-episode truth access</text>
   </g>
   <g id="text_9">
    <text style="fill: #60738a; font: 8.5px 'DejaVu Sans'; text-anchor: middle" x="237.978" y="132.2712" transform="rotate(-0 237.978 132.2712)">public</text>
   </g>
   <g id="text_10">
    <text style="fill: #60738a; font: 8.5px 'DejaVu Sans'; text-anchor: middle" x="478.197" y="132.2712" transform="rotate(-0 478.197 132.2712)">seal</text>
   </g>
   <g id="text_11">
    <text style="fill: #916b14; font: 8.5px 'DejaVu Sans'; text-anchor: middle" x="482.382" y="85.1472" transform="rotate(-0 482.382 85.1472)">information boundary</text>
   </g>
   <g id="text_12">
    <text style="fill: #172a42; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="33.75" y="280.296" transform="rotate(-0 33.75 280.296)">RESEARCH AUDIT LEDGER</text>
   </g>
   <g id="text_13">
    <text style="fill: #60738a; font: 9.5px 'DejaVu Sans'; text-anchor: start" x="33.75" y="306.364116" transform="rotate(-0 33.75 306.364116)">Input-file hashes  /  raw-before-derived records  /  linked events  /  unknown cost retained  /  replay</text>
   </g>
   <g id="text_14">
    <text style="fill: #60738a; font: 8px 'DejaVu Sans'; text-anchor: start" x="28.728" y="338.508" transform="rotate(-0 28.728 338.508)">Research controls in one Python process; see the documented isolation and single-writer limits.</text>
   </g>
